# ==============================================================
# CI/CD Pipeline for ML Notebook + ISA2 Module
# ==============================================================
# Triggers:
#   - Every push and PR to main
#
# Jobs:
#   1. lint        – convert notebook to .py, run pylint
#   2. isa2-lint   – run pylint on isa2/ Python module
#   3. isa2-test   – run unittest (PyUnit) on isa2/ tests
#   4. build-test  – execute the notebook end-to-end, export HTML
#   5. deploy      – publish HTML report to GitHub Pages (main only)
# ==============================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ── 1. Lint (Notebook) ─────────────────────────────────────
  lint:
    name: Pylint Notebook
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pylint

      - name: Convert notebook to Python script
        run: jupyter nbconvert --to script notebook085d1cc1d4.ipynb --output notebook

      - name: Run pylint
        run: pylint notebook.py --disable=C0114,C0116,C0103,E0401,W0621 --exit-zero

  # ── 2. Lint (ISA2) ─────────────────────────────────────────
  isa2-lint:
    name: Pylint ISA2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pylint
        run: pip install pylint

      - name: Run pylint on isa2
        run: pylint isa2/x.py --rcfile=isa2/.pylintrc

  # ── 3. Unit Tests (ISA2) ───────────────────────────────────
  isa2-test:
    name: PyUnit ISA2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s isa2 -p "test_*.py" -v

  # ── 4. Build & Test (Notebook) ─────────────────────────────
  build-test:
    name: Build & Test Notebook
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Execute notebook
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute \
            --ExecutePreprocessor.timeout=120 \
            --output executed_notebook.ipynb \
            notebook085d1cc1d4.ipynb

      - name: Convert to HTML report
        run: |
          jupyter nbconvert \
            --to html \
            --no-input \
            executed_notebook.ipynb \
            --output index.html \
            --output-dir=public

      - name: Upload HTML report artifact
        uses: actions/upload-artifact@v4
        with:
          name: notebook-report
          path: public/
          retention-days: 30

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

  # ── 5. Deploy to GitHub Pages ──────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [build-test, isa2-test]
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
